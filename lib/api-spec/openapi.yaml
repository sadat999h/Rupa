openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rupa — Women's Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: products
    description: Product listings
  - name: categories
    description: Product categories
  - name: orders
    description: Orders management
  - name: reviews
    description: Product reviews
  - name: sellers
    description: Seller profiles
  - name: cart
    description: Shopping cart
  - name: recipes
    description: Recipes and food
  - name: dashboard
    description: Seller dashboard
  - name: marketplace
    description: Marketplace summary

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMe
      tags: [auth]
      summary: Update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Categories
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # Products
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sellerId
          in: query
          schema:
            type: integer
        - name: kitchenOnly
          in: query
          description: If true, return only Home Food items (products with a kitchenId). If omitted/false, Home Food items are excluded — they belong on the /food marketplace, not the Bazaar.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured products for homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/trending:
    get:
      operationId: getTrendingProducts
      tags: [products]
      summary: Get trending products
      responses:
        "200":
          description: Trending products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Reviews
  /products/{productId}/reviews:
    get:
      operationId: getProductReviews
      tags: [reviews]
      summary: Get reviews for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # Kitchens
  /kitchens:
    get:
      operationId: getKitchens
      tags: [kitchens]
      summary: List home kitchens with optional search
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated kitchen list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenListResponse"
    post:
      operationId: createKitchen
      tags: [kitchens]
      summary: Create the current seller's kitchen profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitchenInput"
      responses:
        "201":
          description: Kitchen created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kitchen"

  /kitchens/mine:
    get:
      operationId: getMyKitchen
      tags: [kitchens]
      summary: Get the current seller's own kitchen profile
      responses:
        "200":
          description: Kitchen details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenDetail"
        "404":
          description: No kitchen yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kitchens/{id}:
    get:
      operationId: getKitchen
      tags: [kitchens]
      summary: Get kitchen details with its food menu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Kitchen details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateKitchen
      tags: [kitchens]
      summary: Update a kitchen profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitchenUpdate"
      responses:
        "200":
          description: Updated kitchen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kitchen"

  # Recipes
  /recipes:
    get:
      operationId: getRecipes
      tags: [recipes]
      summary: List all recipes
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated recipe list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Create a new recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get a recipe by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recipe details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Sellers
  /sellers:
    get:
      operationId: getSellers
      tags: [sellers]
      summary: List all sellers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerProfile"

  /sellers/top:
    get:
      operationId: getTopSellers
      tags: [sellers]
      summary: Get top-rated sellers
      responses:
        "200":
          description: Top sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerProfile"

  /sellers/{id}:
    get:
      operationId: getSellerProfile
      tags: [sellers]
      summary: Get seller profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seller profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Cart
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current user's cart
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear entire cart
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /cart/{productId}:
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  # Orders
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get orders for current user (buyer or seller)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [buyer, seller]
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (seller action)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get seller dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # Marketplace summary
  /marketplace/summary:
    get:
      operationId: getMarketplaceSummary
      tags: [marketplace]
      summary: Get marketplace-level summary for homepage
      responses:
        "200":
          description: Marketplace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    # Auth schemas
    RegisterInput:
      type: object
      properties:
        name:
          type: string
        nameBn:
          type: ["string", "null"]
        email:
          type: string
        password:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [buyer, seller]
        location:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
      required:
        - name
        - email
        - password
        - role

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameBn:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [buyer, seller]
        avatar:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        isVerified:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - isVerified
        - createdAt

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
        nameBn:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]

    # Category
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameBn:
          type: string
        slug:
          type: string
        icon:
          type: string
        productCount:
          type: integer
      required:
        - id
        - name
        - nameBn
        - slug
        - icon
        - productCount

    # Product
    Product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleBn:
          type: ["string", "null"]
        description:
          type: string
        price:
          type: number
        categorySlug:
          type: string
        categoryName:
          type: string
        categoryNameBn:
          type: string
        images:
          type: array
          items:
            type: string
        sellerId:
          type: integer
        sellerName:
          type: string
        sellerAvatar:
          type: ["string", "null"]
        stock:
          type: integer
        isActive:
          type: boolean
        avgRating:
          type: ["number", "null"]
        reviewCount:
          type: integer
        kitchenId:
          type: ["integer", "null"]
        kitchenName:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - price
        - categorySlug
        - categoryName
        - categoryNameBn
        - images
        - sellerId
        - sellerName
        - stock
        - isActive
        - reviewCount
        - createdAt

    ProductDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleBn:
          type: ["string", "null"]
        description:
          type: string
        price:
          type: number
        categorySlug:
          type: string
        categoryName:
          type: string
        categoryNameBn:
          type: string
        images:
          type: array
          items:
            type: string
        sellerId:
          type: integer
        sellerName:
          type: string
        sellerAvatar:
          type: ["string", "null"]
        sellerLocation:
          type: ["string", "null"]
        stock:
          type: integer
        isActive:
          type: boolean
        avgRating:
          type: ["number", "null"]
        reviewCount:
          type: integer
        kitchenId:
          type: ["integer", "null"]
        kitchenName:
          type: ["string", "null"]
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - price
        - categorySlug
        - categoryName
        - categoryNameBn
        - images
        - sellerId
        - sellerName
        - stock
        - isActive
        - reviewCount
        - reviews
        - createdAt

    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - products
        - total
        - page
        - limit

    ProductInput:
      type: object
      properties:
        title:
          type: string
        titleBn:
          type: ["string", "null"]
        description:
          type: string
        price:
          type: number
        categorySlug:
          type: string
        images:
          type: array
          items:
            type: string
        stock:
          type: integer
        kitchenId:
          type: ["integer", "null"]
      required:
        - title
        - description
        - price
        - categorySlug
        - images
        - stock

    ProductUpdate:
      type: object
      properties:
        title:
          type: string
        titleBn:
          type: ["string", "null"]
        description:
          type: string
        price:
          type: number
        categorySlug:
          type: string
        images:
          type: array
          items:
            type: string
        stock:
          type: integer
        isActive:
          type: boolean
        kitchenId:
          type: ["integer", "null"]

    # Kitchen
    Kitchen:
      type: object
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        ownerName:
          type: string
        ownerAvatar:
          type: ["string", "null"]
        name:
          type: string
        nameBn:
          type: ["string", "null"]
        description:
          type: string
        cuisineType:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isOpen:
          type: boolean
        foodItemCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - ownerId
        - ownerName
        - name
        - description
        - isOpen
        - foodItemCount
        - createdAt

    KitchenDetail:
      allOf:
        - $ref: "#/components/schemas/Kitchen"
        - type: object
          properties:
            foodItems:
              type: array
              items:
                $ref: "#/components/schemas/Product"
          required:
            - foodItems

    KitchenListResponse:
      type: object
      properties:
        kitchens:
          type: array
          items:
            $ref: "#/components/schemas/Kitchen"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - kitchens
        - total
        - page
        - limit

    KitchenInput:
      type: object
      properties:
