        cuisineType:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
      required:
        - name
        - description

    KitchenUpdate:
      type: object
      properties:
        name:
