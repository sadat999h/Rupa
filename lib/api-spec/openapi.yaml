        page:
          type: integer
        limit:
          type: integer
      required:
        - recipes
        - total
        - page
        - limit

    RecipeInput:
      type: object
      properties:
        title:
          type: string
        titleBn:
          type: ["string", "null"]
        description:
          type: string
        ingredients:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        isForSale:
          type: boolean
        price:
          type: ["number", "null"]
      required:
        - title
        - description
        - ingredients
        - steps
        - images
        - isForSale

    # Cart
    CartItem:
      type: object
      properties:
        productId:
          type: integer
        productTitle:
          type: string
        productImage:
          type: ["string", "null"]
        price:
          type: number
        quantity:
          type: integer
        sellerName:
          type: string
      required:
        - productId
        - productTitle
        - price
        - quantity
        - sellerName

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
        itemCount:
          type: integer
      required:
        - items
        - total
        - itemCount

    CartItemInput:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
      required:
        - productId
        - quantity

    # Order
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productTitle:
          type: string
        productImage:
          type: ["string", "null"]
        quantity:
          type: integer
        price:
          type: number
      required:
        - id
        - productId
        - productTitle
        - quantity
        - price

    Order:
      type: object
      properties:
        id:
          type: integer
        buyerId:
          type: integer
        buyerName:
          type: string
        sellerId:
          type: integer
        sellerName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        deliveryAddress:
          type: string
        deliveryPhone:
          type: string
        note:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - buyerId
        - buyerName
        - sellerId
        - sellerName
        - items
        - total
        - status
        - paymentStatus
        - deliveryAddress
        - deliveryPhone
        - createdAt

    OrderInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        deliveryAddress:
          type: string
        deliveryPhone:
          type: string
        note:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [bkash, nagad, rocket, cod]
      required:
        - items
        - deliveryAddress
        - deliveryPhone
        - paymentMethod

    OrderItemInput:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
      required:
        - productId
        - quantity

    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, processing, shipped, delivered, cancelled]
      required:
        - status

    # Dashboard
    DashboardStats:
      type: object
      properties:
