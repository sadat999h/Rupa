          type: array
          items:
            $ref: "#/components/schemas/Order"
        monthlyRevenue:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyRevenue"
      required:
        - totalRevenue
        - totalOrders
        - totalProducts
        - pendingOrders
        - recentOrders
        - monthlyRevenue

    MonthlyRevenue:
      type: object
      properties:
        month:
          type: string
        revenue:
          type: number
      required:
        - month
        - revenue

    # Marketplace summary
    MarketplaceSummary:
      type: object
      properties:
