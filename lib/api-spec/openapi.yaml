        buyerId:
          type: integer
        buyerName:
          type: string
        buyerAvatar:
          type: ["string", "null"]
        rating:
          type: integer
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - productId
        - buyerId
        - buyerName
        - rating
        - createdAt

    ReviewInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
      required:
        - rating

    # Seller profile
    SellerProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameBn:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        isVerified:
          type: boolean
        productCount:
          type: integer
        avgRating:
          type: ["number", "null"]
        totalSales:
          type: integer
        joinedAt:
          type: string
      required:
        - id
        - name
        - isVerified
        - productCount
        - totalSales
        - joinedAt

    # Recipe
    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleBn:
          type: ["string", "null"]
        description:
          type: string
        ingredients:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        authorId:
          type: integer
        authorName:
          type: string
        authorAvatar:
          type: ["string", "null"]
        isForSale:
          type: boolean
        price:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - ingredients
        - steps
        - images
        - authorId
        - authorName
        - isForSale
        - createdAt

    RecipeListResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
        total:
