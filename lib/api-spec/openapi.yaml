        nameBn:
          type: ["string", "null"]
        description:
          type: string
        cuisineType:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isOpen:
          type: boolean

    # Review
    Review:
      type: object
      properties:
        id:
          type: integer
        productId:
